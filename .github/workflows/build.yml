name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip
        run: |
          Z=$(find . -name sis.zip -not -path "./.git/*" | head -n1)
          echo "Zip: $Z"
          mkdir -p /tmp/proj
          unzip -o "$Z" -d /tmp/proj
      - name: Build
        run: |
          S=$(find /tmp/proj -name settings.gradle.kts | head -n1)
          echo "Found: $S"
          cd "$(dirname "$S")"
          gradle assembleDebug
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: island-apk
          path: /tmp/out/app-debug.apk
